name: sns_auto
description: "SNS Auto video generator & multi-platform uploader"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Image/file picker for photo selection from gallery
  image_picker: ^1.0.7

  # Video player for previewing generated videos
  video_player: ^2.8.2

  # Secure storage for sensitive tokens (Instagram, etc.)
  flutter_secure_storage: ^9.0.0

  # HTTP client for SNS API calls
  http: ^1.2.0

  # Path utilities for file handling
  path: ^1.8.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Audio assets
  assets:
    - assets/audio/bgm/
